# 端口 8081，8080 被占了；改了记得同步改回调地址
server.port=8081
server.servlet.context-path=/
server.tomcat.uri-encoding=UTF-8
spring.application.name=shede

# MySQL 8，驱动别用老的 com.mysql.jdbc.Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 时区不写时间差 8 小时；公钥那项不加认证失败
spring.datasource.url=jdbc:mysql://localhost:3306/shede_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=20071108
# 连接池，max-lifetime 要小于 MySQL 的 wait_timeout，不然会连不上
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# MyBatis，下划线转驼峰必须开，不然字段全是 null
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.youkeda.shede.dataobject
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=10
mybatis.configuration.use-generated-keys=true

# PageHelper 分页，页码越界会自动纠正到第一页或最后一页
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
# support-methods-arguments 要 false，设 true 它自己去参数里猜，会重复 LIMIT 直接报错
pagehelper.support-methods-arguments=false
pagehelper.params=count=countSql
pagehelper.page-size-zero=false

# Redis 本地连的地址，3 秒超时就快速失败
spring.redis.host=localhost
spring.redis.port=6379
# 本地 redis 没密码，这行别打开，一配就连不上
#spring.redis.password=123456
spring.redis.database=0
spring.redis.timeout=3000ms
# Lettuce 连接池，max-wait 是池用完最多等多久
spring.redis.lettuce.pool.max-active=32
spring.redis.lettuce.pool.max-idle=16
spring.redis.lettuce.pool.min-idle=4
spring.redis.lettuce.pool.max-wait=3000ms
spring.redis.lettuce.shutdown-timeout=200ms

# Redisson 单机直接用上面的 host/port，这两行二选一，别同时开
#spring.redis.redisson.file=classpath:redisson.yaml
#spring.redis.redisson.config=classpath:redisson.yaml

# 沙箱，前三个是占位符，不换成自己的签名过不了
alipay.app-id=2021000000000000
alipay.private-key=YOUR_APP_PRIVATE_KEY_PLACEHOLDER
alipay.alipay-public-key=YOUR_ALIPAY_PUBLIC_KEY_PLACEHOLDER
alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do
# 通知地址要公网能访问，本地调试得用内网穿透
alipay.notify-url=http://localhost:8081/alipaycallback
# 同步跳转只是个展示页，不代表支付结果
alipay.return-url=http://localhost:8081/alipayurl.html
alipay.charset=UTF-8
alipay.sign-type=RSA2
alipay.format=json

# Jackson，时区不给 GMT+8 前端时间会差 8 小时
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# 日志，本项目的包开 debug，开发时好排查
logging.level.root=info
logging.level.com.youkeda.shede=debug
logging.level.com.youkeda.shede.dao=debug
