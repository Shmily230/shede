<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>确认订单 · 舍得</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 品牌色和卡片阴影
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' } },
          boxShadow: { card: '0 18px 40px -24px rgba(2,132,199,.45)' }
        }
      }
    };
  </script>
  <style>
    /* iPhone 底部安全区 */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    #alipayOverlay.is-open { display: flex; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 antialiased">

  <!-- 顶部导航 -->
  <header class="sticky top-0 z-40 border-b border-neutral-200/70 bg-white/85 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center gap-3 px-4">
      <a href="javascript:history.back()" class="grid h-9 w-9 place-items-center rounded-xl bg-neutral-100 text-neutral-500 transition hover:bg-neutral-200" aria-label="返回">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="index.html" class="flex items-center gap-2">
        <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-sky-400 to-cyan-400 text-lg font-black text-white shadow-card">舍</span>
        <span class="hidden text-xl font-black tracking-[0.15em] sm:block">舍得</span>
      </a>
      <span class="ml-2 hidden text-sm text-neutral-400 sm:block">确认订单</span>
      <button id="authBtn" class="ml-auto rounded-full bg-neutral-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-neutral-700">登录</button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 pb-28 pt-6 sm:pb-12">
    <div class="grid gap-5 lg:grid-cols-[1.4fr,1fr]">
      <!-- 左边：商品和收货信息 -->
      <section class="space-y-5">
        <div class="rounded-3xl bg-white p-5 ring-1 ring-neutral-100">
          <div class="flex items-center justify-between">
            <h2 class="text-sm font-semibold">商品清单</h2>
            <span class="text-[11px] text-neutral-400">正品保障 · 48 小时内发货</span>
          </div>

          <div id="productCard" class="mt-4 space-y-4">
            <div class="flex gap-4">
              <div class="skeleton h-24 w-24 shrink-0 rounded-2xl"></div>
              <div class="flex-1 space-y-2">
                <div class="skeleton h-4 w-2/3 rounded"></div>
                <div class="skeleton h-3 w-1/3 rounded"></div>
                <div class="skeleton h-3 w-1/4 rounded"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="rounded-3xl bg-white p-5 ring-1 ring-neutral-100">
          <h2 class="text-sm font-semibold">收货信息</h2>
          <div class="mt-3 grid gap-3 sm:grid-cols-2">
            <label class="block">
              <span class="text-xs text-neutral-500">收货人</span>
              <input id="receiver" value="舍得用户" class="mt-1 w-full rounded-xl border border-neutral-200 px-4 py-2.5 text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
            </label>
            <label class="block">
              <span class="text-xs text-neutral-500">联系电话</span>
              <input id="phone" value="13800000000" class="mt-1 w-full rounded-xl border border-neutral-200 px-4 py-2.5 text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
            </label>
            <label class="block sm:col-span-2">
              <span class="text-xs text-neutral-500">收货地址</span>
              <input id="address" value="浙江省杭州市西湖区文一西路 969 号" class="mt-1 w-full rounded-xl border border-neutral-200 px-4 py-2.5 text-sm outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-100" />
            </label>
          </div>
          <p class="mt-3 text-[11px] text-neutral-400">演示项目：地址仅作展示，不落库</p>
        </div>
      </section>

      <!-- 右边：金额和支付 -->
      <section class="lg:sticky lg:top-24 lg:self-start">
        <div class="rounded-3xl bg-white p-5 ring-1 ring-neutral-100">
          <h2 class="text-sm font-semibold">支付明细</h2>
          <dl class="mt-4 space-y-2.5 text-sm">
            <div class="flex justify-between"><dt class="text-neutral-500">商品合计</dt><dd id="sumGoods" class="font-medium">¥0.00</dd></div>
            <div class="flex justify-between"><dt class="text-neutral-500">运费</dt><dd class="text-neutral-500">包邮</dd></div>
            <div class="flex justify-between"><dt class="text-neutral-500">优惠</dt><dd class="text-neutral-500">-</dd></div>
            <div class="mt-2 flex items-end justify-between border-t border-dashed border-neutral-200 pt-3">
              <dt class="text-neutral-500">应付总额</dt>
              <dd id="sumTotal" class="text-2xl font-black text-sky-600">¥0.00</dd>
            </div>
          </dl>

          <div class="mt-5 space-y-2">
            <p class="text-xs font-semibold text-neutral-700">支付方式</p>
            <label class="flex items-center gap-3 rounded-2xl border border-sky-300 bg-sky-50/70 p-3">
              <input type="radio" name="payType" checked class="h-4 w-4 accent-sky-500" />
              <span class="grid h-9 w-9 place-items-center rounded-xl bg-[#1677ff] text-[11px] font-bold text-white">支</span>
              <span class="flex-1">
                <span class="block text-sm font-medium">支付宝（沙箱）</span>
                <span class="block text-[11px] text-neutral-400">跳转沙箱收银台完成支付</span>
              </span>
            </label>
          </div>

          <button id="payBtn" class="mt-5 hidden w-full rounded-2xl bg-sky-500 py-3.5 text-sm font-semibold text-white shadow-card transition hover:bg-sky-600 disabled:cursor-not-allowed disabled:opacity-60 sm:block">
            去支付
          </button>
          <p class="mt-3 text-center text-[11px] text-neutral-400">点击即表示同意《舍得交易服务协议》</p>
        </div>
      </section>
    </div>
  </main>

  <!-- 移动端支付栏 -->
  <div class="fixed inset-x-0 bottom-0 z-30 border-t border-neutral-200 bg-white/95 px-4 py-3 backdrop-blur safe-bottom sm:hidden">
    <div class="flex items-center gap-3">
      <div class="min-w-0 flex-1">
        <p class="text-xs text-neutral-400">应付总额</p>
        <p id="mobileTotal" class="text-lg font-black text-sky-600">¥0.00</p>
      </div>
      <button id="mobilePayBtn" class="rounded-full bg-sky-500 px-8 py-3 text-sm font-semibold text-white shadow-lg shadow-sky-200 transition active:scale-95">去支付</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function () {
      var Shede = window.Shede;
      // 参数都在 URL 上，详情页带过来的
      var params = new URLSearchParams(location.search);
      var productId = params.get('productId');
      var detailId = params.get('productDetailId');
      var quantity = Math.max(1, parseInt(params.get('quantity') || '1', 10));

      var state = { product: null, detail: null, order: null, paying: false };

      var productCard = document.getElementById('productCard');
      var sumGoods = document.getElementById('sumGoods');
      var sumTotal = document.getElementById('sumTotal');
      var mobileTotal = document.getElementById('mobileTotal');
      var payBtn = document.getElementById('payBtn');
      var mobilePayBtn = document.getElementById('mobilePayBtn');
      var authBtn = document.getElementById('authBtn');

      function renderAuthButton() {
        var user = Shede.auth.getUser();
        authBtn.textContent = user ? (user.nickname || user.username) : '登录';
        authBtn.className = user
          ? 'ml-auto rounded-full border border-neutral-200 bg-white px-4 py-2 text-sm font-medium text-neutral-700 transition hover:text-sky-600'
          : 'ml-auto rounded-full bg-neutral-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-neutral-700';
      }

      Shede.onAuthChange = function () { renderAuthButton(); };

      authBtn.addEventListener('click', function () {
        var user = Shede.auth.getUser();
        if (user) {
          if (confirm('当前账号：' + user.username + '\n点击确定退出登录')) {
            Shede.auth.logout();
            renderAuthButton();
            Shede.toast('已退出登录');
          }
          return;
        }
        Shede.openAuth(function () { renderAuthButton(); });
      });

      // 单价优先用规格的，没有就退商品价
      function render() {
        var detail = state.detail;
        var product = state.product;
        var unitPrice = detail.price != null ? detail.price : product.price;
        var total = Number(unitPrice) * quantity;

        productCard.innerHTML = '' +
          '<div class="flex gap-4">' +
          '  <div class="relative h-24 w-24 shrink-0 overflow-hidden rounded-2xl bg-gradient-to-br from-sky-100 via-neutral-50 to-neutral-200">' +
          '    <div class="absolute inset-0 grid place-items-center"><span class="text-xl font-black text-sky-200/90">舍得</span></div>' +
          '  </div>' +
          '  <div class="min-w-0 flex-1">' +
          '    <p class="truncate text-sm font-semibold">' + Shede.escapeHtml(product.name) + '</p>' +
          '    <p class="mt-1 text-xs text-neutral-400">' + Shede.escapeHtml(product.subtitle || '') + '</p>' +
          '    <p class="mt-2 text-[11px] text-neutral-500">尺码 ' + Shede.escapeHtml(detail.size || '-') +
          ' · 颜色 ' + Shede.escapeHtml(detail.color || '-') + ' · 数量 ' + quantity + '</p>' +
          '  </div>' +
          '  <div class="shrink-0 text-right">' +
          '    <p class="text-sm font-black text-sky-600">' + Shede.money(unitPrice) + '</p>' +
          '    <p class="mt-1 text-[11px] text-neutral-400">x' + quantity + '</p>' +
          '  </div>' +
          '</div>' +
          '<div class="rounded-2xl bg-neutral-50 px-4 py-3 text-[11px] text-neutral-500">' +
          '  商品编号 ' + Shede.escapeHtml(product.productId) + ' · 规格编号 ' + Shede.escapeHtml(detail.productDetailId) +
          '</div>';

        sumGoods.textContent = Shede.money(total);
        sumTotal.textContent = Shede.money(total);
        mobileTotal.textContent = Shede.money(total);
        payBtn.disabled = false;
        mobilePayBtn.disabled = false;
      }

      // 去支付：先下单再唤起支付宝
      async function pay() {
        if (state.paying) {
          return;
        }
        var product = state.product;
        var detail = state.detail;
        if (!product || !detail) {
          Shede.toast('商品信息未加载完成', 'error');
          return;
        }
        Shede.requireLogin(async function (user) {
          state.paying = true;
          payBtn.disabled = true;
          mobilePayBtn.disabled = true;
          var originText = payBtn.textContent;
          payBtn.textContent = '处理中…';
          try {
            // 已经有订单就复用，别重复下单
            var order = state.order;
            if (!order) {
              order = await Shede.api.createOrder({
                userId: user.userId,
                productId: product.productId,
                productDetailId: detail.productDetailId,
                quantity: quantity
              });
              state.order = order;
            }
            // 拿表单提交出去，整页会跳到支付宝
            await Shede.alipay.pay(order.orderId, user.userId);
          } catch (e) {
            Shede.toast(e.message, 'error');
            Shede.alipay.hideOverlay();
            state.paying = false;
            payBtn.disabled = false;
            mobilePayBtn.disabled = false;
            payBtn.textContent = originText;
          }
        });
      }

      payBtn.addEventListener('click', pay);
      mobilePayBtn.addEventListener('click', pay);

      // 规格没了或者库存不够，直接把按钮禁掉
      async function load() {
        if (!productId || !detailId) {
          Shede.toast('缺少商品参数，正在返回首页', 'error');
          setTimeout(function () { location.href = 'index.html'; }, 1200);
          return;
        }
        try {
          var product = await Shede.api.productDetail(productId);
          var detail = (product.productDetails || []).filter(function (item) {
            return item.productDetailId === detailId;
          })[0];
          if (!detail) {
            throw new Error('该规格已下架，请返回重新选择');
          }
          if (detail.stock != null && detail.stock < quantity) {
            throw new Error('库存不足，仅剩 ' + detail.stock + ' 件');
          }
          state.product = product;
          state.detail = detail;
          render();
        } catch (e) {
          productCard.innerHTML = '<p class="text-sm text-rose-500">' + Shede.escapeHtml(e.message) + '</p>';
          payBtn.disabled = true;
          mobilePayBtn.disabled = true;
        }
      }

      // 初始化：先画登录态再拉数据
      renderAuthButton();
      load();
    })();
  </script>
</body>
</html>
