# 舍得 B2C 平台 · 一键启动（app + mysql + redis）
# 用法：docker compose up -d --build
# 访问：http://localhost:8081

services:
  mysql:
    image: mysql:8.0
    container_name: shede-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: shede_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动按文件名顺序执行，初始化后不会重复执行
      - ./sql/shede.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed-data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: shede-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shede-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 application.properties，容器内用服务名互相访问
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shede_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-2021000000000000}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-YOUR_APP_PRIVATE_KEY_PLACEHOLDER}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-YOUR_ALIPAY_PUBLIC_KEY_PLACEHOLDER}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost:8081/alipaycallback}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost:8081/alipayurl.html}
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m -Dfile.encoding=UTF-8"
    ports:
      - "8081:8081"

volumes:
  mysql-data:
  redis-data:
